<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色配置器 · 本地持久化演示</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#controls">跳到控制面板</a>
  <header class="app-header">
    <h1>角色配置器</h1>
    <p class="subtitle">无服务器 · 所有数据仅保存在浏览器 <code>localStorage</code> / <code>sessionStorage</code></p>
  </header>

  <main class="layout">
    <section class="panel preview-panel" aria-labelledby="preview-title">
      <h2 id="preview-title">渲染预览</h2>
      <div id="previewScroll" class="preview-scroll" tabindex="0" aria-label="角色预览区域，可滚动">
        <svg id="characterSvg" class="character" viewBox="0 0 240 320" role="img"
             aria-labelledby="svgTitle svgDesc"></svg>
      </div>
      <div id="animationNote" class="animation-note" aria-live="polite"></div>
    </section>

    <section class="panel" id="controls" aria-labelledby="controls-title">
      <h2 id="controls-title">配置参数</h2>

      <h3>配色</h3>
      <div class="field-grid" id="colorsFields"></div>

      <h3>装备</h3>
      <div class="field-grid" id="equipmentFields"></div>

      <h3>动画参数</h3>
      <div class="field-grid" id="animationFields"></div>

      <p id="inlineError" class="inline-error" role="alert" hidden></p>

      <div class="button-row">
        <button id="exportBtn" type="button">导出配置 (JSON)</button>
        <button id="importBtn" type="button">导入配置…</button>
        <button id="rollbackBtn" type="button" disabled>回滚上次导入</button>
        <button id="undoBtn" type="button">撤销最后修改</button>
        <button id="recoverBtn" type="button" disabled>恢复保存（重建损坏存储）</button>
      </div>
    </section>

    <aside class="panel status-panel" aria-labelledby="status-title">
      <h2 id="status-title">关键状态（输入 / 存储 / 渲染 同步核对）</h2>
      <dl id="statusList" class="status-list"></dl>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="importModal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
      <h2 id="modalTitle">导入配置 · 差异预览</h2>
      <p id="modalDesc" class="modal-desc">确认前不会覆盖当前配置。</p>
      <div class="modal-body">
        <textarea id="importText" rows="8" aria-label="待导入的 JSON 配置"
          placeholder='粘贴配置 JSON，例如 {"config":{...}}'></textarea>
        <p id="importParseError" class="inline-error" role="alert" hidden></p>
        <div id="diffView" class="diff-view" aria-label="配置差异列表" role="log"></div>
      </div>
      <div class="button-row modal-actions">
        <button id="confirmImportBtn" type="button" disabled>确认覆盖</button>
        <button id="cancelImportBtn" type="button">取消 (Esc)</button>
      </div>
    </div>
  </div>

  <pre id="exportArea" class="export-area" hidden tabindex="0" aria-label="导出的 JSON，按 Esc 关闭"></pre>

  <script type="module" src="app.js"></script>
</body>
</html>
