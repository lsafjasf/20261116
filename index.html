<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三层地图绘制与验证台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>三层地图绘制与验证台</h1>
  <div class="toolbar">
    <button id="tool-select" class="tool active">选择/拖动节点</button>
    <button id="tool-draw" class="tool">绘制（点击加点，双击结束）</button>
    <span class="sep"></span>
    <button id="btn-export-svg">导出 SVG</button>
    <button id="btn-export-png">导出高清 PNG ×3</button>
    <button id="btn-save-json">保存工程 JSON</button>
    <label class="file-label">载入 JSON<input type="file" id="file-load" accept=".json"></label>
    <span class="sep"></span>
    <button id="btn-sample">重置示例地图</button>
    <button id="btn-restore" title="恢复快照中的参数与算法状态">一键恢复</button>
  </div>
</header>

<main>
  <aside id="layer-panel">
    <h2>图层与线型</h2>
    <div id="layer-controls"></div>
    <h2>算法状态摘要</h2>
    <div id="algo-status" class="mono"></div>
  </aside>

  <section id="canvas-wrap">
    <svg id="map" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet">
      <rect id="bg" x="0" y="0" width="960" height="600" fill="#f4f8fb"></rect>
      <g id="viewport">
        <g id="layers"></g>
        <g id="labels"></g>
        <g id="handles"></g>
      </g>
    </svg>
    <div id="hint">世界坐标系：960 × 600，原点在左上。图层开关仅切换可见性，不改动任何坐标。</div>
  </section>

  <aside id="metrics-panel">
    <h2>对照参数快照</h2>
    <div id="param-snapshot" class="mono"></div>
    <h2>场景测试（普通 / 边界 / 失败）</h2>
    <button id="btn-run-tests">运行全部场景测试</button>
    <div id="test-results"></div>
    <h2>一致性结论</h2>
    <div id="verdict" class="mono"></div>
  </aside>
</main>

<script src="js/core.js"></script>
<script src="js/sample.js"></script>
<script src="js/app.js"></script>
</body>
</html>
