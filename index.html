<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海底电缆维修仿真 · 确定性时钟 / 回放 / 断缆恢复</title>
<style>
  :root {
    --bg: #0b1622; --panel: #122233; --line: #1e3a52;
    --text: #d7e6f2; --dim: #7fa3bd; --ok: #35d07f;
    --warn: #f2b134; --bad: #ef5d5d; --accent: #4aa8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .cluster { display: flex; gap: 6px; flex-wrap: wrap; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  canvas { width: 100%; display: block; border-radius: 8px; background: linear-gradient(#0a1f33, #06121f); }
  button, select {
    background: #17314a; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #14507f; border-color: #2a73ad; }
  button.danger { background: #5a2430; border-color: #8a3542; }
  .metric { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .metric .k { color: var(--dim); }
  .bar { height: 7px; background: #0c1c2b; border-radius: 4px; overflow: hidden; margin: 3px 0 8px; }
  .bar > i { display: block; height: 100%; background: var(--ok); transition: width .15s linear; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .badge.running { color: var(--ok); border-color: #1d5c3d; }
  .badge.aborted { color: var(--bad); border-color: #6e2f35; }
  .badge.recovering, .badge.soak { color: var(--warn); border-color: #6b5320; }
  .badge.complete { color: var(--accent); border-color: #1d4f78; }
  #log { height: 220px; overflow: auto; font-size: 12px; font-family: ui-monospace, Menlo, monospace; background: #0a1826; border-radius: 8px; padding: 8px; }
  #log .ev { margin-bottom: 3px; color: var(--dim); }
  #log .ev.abort { color: var(--bad); } #log .ev.fault { color: var(--warn); }
  #log .ev.joint_done, #log .ev.soak_complete, #log .ev.recovery_complete { color: var(--ok); }
  .hint { color: var(--dim); font-size: 12px; }
  h2 { font-size: 13px; margin: 12px 0 6px; color: var(--accent); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>海底电缆维修仿真</h1>
  <span class="badge running" id="modeBadge">running</span>
  <span class="hint">seed: <b>cable-sim-2026</b> · dt=0.1s · 固定步长确定性时钟</span>
  <div class="cluster" style="margin-left:auto">
    <select id="scenario">
      <option value="normal">正常流程</option>
      <option value="thruster">设备故障（推进器）</option>
      <option value="overload">参数越限（过载+漂移）</option>
      <option value="break">断缆恢复</option>
      <option value="manual">手动操作</option>
    </select>
    <button class="primary" id="btnLoad">载入场景</button>
  </div>
</header>
<main>
  <section class="card">
    <canvas id="scene" width="900" height="520"></canvas>
    <div class="row" style="margin-top:8px">
      <button id="btnPause">暂停</button>
      <button id="btnStep">单步</button>
      <button id="btnResume">恢复</button>
      <button id="btnReplay">失败回放</button>
      <button id="btnRecover" class="danger">执行恢复</button>
      <label class="hint">速度
        <select id="speed">
          <option value="1">1×</option><option value="2">2×</option>
          <option value="5">5×</option><option value="20">20×</option>
        </select>
      </label>
      <span class="hint" id="clockInfo">t=0.0s tick=0</span>
    </div>
    <p class="hint">键盘：W/S 收放脐带，A/D 推进器，1/2/3 切换 定位器/切割器/机械臂，P 辅助泵，空格暂停。</p>
    <h2>事件 / 操作记录</h2>
    <div id="log"></div>
  </section>
  <aside>
    <div class="card" id="metrics"></div>
    <div class="card" style="margin-top:12px">
      <h2 style="margin-top:0">场景自检报告</h2>
      <button class="primary" id="btnSelfTest">运行六类自检</button>
      <pre id="selfTest" class="hint" style="white-space:pre-wrap;margin:8px 0 0"></pre>
    </div>
  </aside>
</main>
<script src="src/core.js"></script>
<script src="src/autopilot.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/app.js"></script>
</body>
</html>
