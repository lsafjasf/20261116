<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four-Beat Rush — Synth Rhythm Game</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="layout">
    <canvas id="game" width="720" height="720" aria-label="rhythm game canvas"></canvas>
    <section class="panel">
      <h1>Four-Beat Rush</h1>
      <p class="hint">Press D / F / J / K to hit notes from four directions; Space pauses.</p>

      <div class="row">
        <label>Difficulty
          <select id="difficulty">
            <option value="easy">easy (±90ms)</option>
            <option value="normal" selected>normal (±60ms)</option>
            <option value="hard">hard (±35ms)</option>
          </select>
        </label>
        <label>BPM <input id="bpm" type="number" value="120" min="60" max="240"></label>
        <label>Beats <input id="beats" type="number" value="48" min="8" max="128"></label>
      </div>
      <div class="row">
        <label>Approach <input id="approach" type="number" value="1.4" min="0.6" max="3" step="0.1">s</label>
        <label>Calibration <input id="offset" type="range" min="-200" max="200" step="5" value="0">
          <span id="offsetValue">0 ms</span></label>
      </div>
      <div class="row">
        <label>Master <input id="masterGain" type="range" min="0" max="1" step="0.05" value="0.8"></label>
        <label>Drums <input id="drumGain" type="range" min="0" max="1" step="0.05" value="0.9"></label>
        <label>Hit SFX <input id="hitGain" type="range" min="0" max="1" step="0.05" value="0.7"></label>
      </div>

      <div class="buttons">
        <button id="btnStart">Start</button>
        <button id="btnPause">Pause</button>
        <button id="btnResume">Resume</button>
        <button id="btnRestart">Restart</button>
        <button id="btnStop">Stop</button>
        <button id="btnSnapshot">Save Snapshot</button>
        <button id="btnRestore">Restore &amp; Compare</button>
        <button id="btnExport">Export WAV</button>
      </div>

      <div id="hud" class="hud">state=idle</div>
      <div id="result" class="result">Waiting for a finished run…</div>
      <div id="restoreReport" class="report"></div>
      <div id="log" class="log"></div>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
