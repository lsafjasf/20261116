<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时自适应配乐引擎</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="layout">
    <header>
      <h1>实时自适应配乐引擎</h1>
      <p class="sub">平静 / 追逐 / 危险三态切换 · 纯 Web Audio 合成 · Canvas 可视化</p>
    </header>

    <section class="panel controls">
      <h2>参数</h2>
      <div class="grid">
        <label>平静→追逐阈值
          <input type="range" id="thresholdCalmChase" min="0.1" max="0.9" step="0.01" />
          <span class="val" data-for="thresholdCalmChase"></span>
        </label>
        <label>追逐→危险阈值
          <input type="range" id="thresholdChaseDanger" min="0.2" max="0.99" step="0.01" />
          <span class="val" data-for="thresholdChaseDanger"></span>
        </label>
        <label>迟滞区间
          <input type="range" id="hysteresis" min="0" max="0.1" step="0.005" />
          <span class="val" data-for="hysteresis"></span>
        </label>
        <label>淡入时长 (s)
          <input type="range" id="fadeInSeconds" min="0.1" max="4" step="0.1" />
          <span class="val" data-for="fadeInSeconds"></span>
        </label>
        <label>速度 BPM
          <input type="range" id="bpm" min="60" max="160" step="1" />
          <span class="val" data-for="bpm"></span>
        </label>
      </div>

      <h3>每层旋律密度</h3>
      <div class="grid">
        <label>环境层
          <input type="range" data-density="ambient" min="0" max="1" step="0.05" />
          <span class="val" data-density-val="ambient"></span>
        </label>
        <label>低音层
          <input type="range" data-density="bass" min="0" max="1" step="0.05" />
          <span class="val" data-density-val="bass"></span>
        </label>
        <label>鼓层
          <input type="range" data-density="drums" min="0" max="1" step="0.05" />
          <span class="val" data-density-val="drums"></span>
        </label>
        <label>旋律层
          <input type="range" data-density="melody" min="0" max="1" step="0.05" />
          <span class="val" data-density-val="melody"></span>
        </label>
      </div>

      <div class="intensity-row">
        <label>手动强度（可拖动模拟输入）
          <input type="range" id="intensity" min="0" max="1" step="0.01" value="0" />
        </label>
        <div class="buttons">
          <button id="startBtn">启动</button>
          <button id="stopBtn" disabled>停止</button>
          <button id="autoBtn">自动模拟</button>
          <button id="saveBtn">保存快照</button>
          <button id="restoreBtn">恢复快照</button>
          <button id="exportBtn">离线导出 20s WAV</button>
        </div>
      </div>
    </section>

    <section class="panel visual">
      <canvas id="trackCanvas" width="960" height="180"></canvas>
      <canvas id="waveCanvas" width="960" height="260"></canvas>
    </section>

    <section class="panel stats">
      <h2>运行状态</h2>
      <div id="statsGrid" class="stats-grid"></div>
      <pre id="log" class="log"></pre>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
