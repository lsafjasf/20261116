<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人协作 · 临时桥面安装</title>
<style>
  body { margin: 0; background: #10151f; color: #dfe7f2; font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 18px; margin: 10px 0 4px; }
  #wrap { display: flex; gap: 12px; align-items: flex-start; }
  canvas { background: #1a2436; border-radius: 8px; }
  #panel { width: 250px; font-size: 13px; }
  .gauge { margin: 6px 0; }
  .gauge label { display: flex; justify-content: space-between; }
  .bar { height: 10px; background: #2a3548; border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: #4da3ff; transition: width .1s; }
  #durabilityBar > div { background: #5fd68a; }
  #tensionBar > div { background: #ffb84d; }
  #dots { font-size: 22px; letter-spacing: 6px; }
  #status { min-height: 40px; padding: 6px; border-radius: 6px; background: #1c2637; }
  #conflict { color: #ff8a8a; font-size: 12px; min-height: 32px; }
  .keys { font-size: 12px; color: #9fb0c8; line-height: 1.7; }
  button { background: #2b3a55; color: #dfe7f2; border: 1px solid #44597f;
    border-radius: 6px; padding: 4px 10px; margin: 2px; cursor: pointer; }
  button:hover { background: #37496b; }
  #replayBar { margin-top: 8px; padding: 6px; background: #1c2637; border-radius: 6px; }
  kbd { background: #2a3548; border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<h1>双人协作 · 临时桥面安装</h1>
<div id="wrap">
  <canvas id="cv" width="900" height="560"></canvas>
  <div id="panel">
    <div id="dots">○ ○ ○</div>
    <div class="gauge"><label><span>吊索张力</span><span id="tensionVal">-</span></label>
      <div class="bar" id="tensionBar"><div></div></div></div>
    <div class="gauge"><label><span>结构耐久</span><span id="durabilityVal">-</span></label>
      <div class="bar" id="durabilityBar"><div></div></div></div>
    <div class="gauge"><label><span>风速</span><span id="windVal">-</span></label></div>
    <div class="gauge"><label><span>支撑温度</span><span id="tempVal">-</span></label></div>
    <div class="gauge"><label><span>允许误差</span><span id="tolVal">-</span></label></div>
    <div id="status">等待开始</div>
    <div id="conflict"></div>
    <div class="keys">
      左侧玩家（吊索）：<kbd>S</kbd> 下降 <kbd>W</kbd> 上升 <kbd>E</kbd> 松钩<br>
      右侧玩家（桥板）：<kbd>←</kbd><kbd>→</kbd> 水平移动 <kbd>Enter</kbd> 松钩<br>
      三点固定后松钩放行车辆；任一侧过早松钩桥板坠落。
    </div>
    <div>
      <button id="btnReset">重置</button>
      <button id="btnReplay">回放本局</button>
    </div>
    <div id="replayBar" style="display:none">
      <button id="btnPlayPause">暂停</button>
      <button id="btnStep">单步</button>
      <button id="btnSpeed">倍速 1x</button>
      <button id="btnExitReplay">退出回放</button>
      <div id="replayInfo" style="font-size:12px;margin-top:4px"></div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
